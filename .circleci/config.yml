version: 2.1
jobs:
  build-test:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm test
      - store_artifacts:
          path: build
          destination: extension
workflows:
  build:
    jobs:
      - build-test
